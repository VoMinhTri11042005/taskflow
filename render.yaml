services:
  - type: web
    name: taskflow
    env: node
    plan: free
    region: oregon
    buildCommand: npm run vercel-build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
