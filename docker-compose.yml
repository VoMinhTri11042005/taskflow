services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_postgres
    restart: always
    environment:
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password_secret
      POSTGRES_DB: taskflow_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_user -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* values are compiled into the browser bundle at build time.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    image: task-app
    container_name: taskflow_app
    restart: always
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://taskflow_user:taskflow_password_secret@postgres:5432/taskflow_db?schema=public
      - NODE_ENV=production
      - PORT=3000
      # Use one stable secret on every app instance. Leave the cookie override
      # blank to infer HTTPS from the incoming request / reverse proxy header.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
